<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Rota">
<link rel="manifest" href="manifest.json">
<title>My Rota</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--work:#111827;--extra:#2563eb;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:20px 16px 18px;position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;}
.header-text h1{margin:0;font-size:26px}.header-text p{margin:4px 0 0;color:#cbd5e1;font-size:13px}
.header-actions{display:flex;gap:10px}
.icon-btn{background:#334155;color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
main{max-width:720px;margin:auto;padding:14px;display:none} 
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
button{border:0;border-radius:11px;padding:10px 13px;font-weight:700;font-size:14px;background:#e5e7eb;color:#111827;cursor:pointer}
button.primary{background:#111827;color:white}.blue{background:#2563eb;color:white}.danger{background:#fee2e2;color:var(--danger)}
.month{flex:1;text-align:center;font-weight:800;font-size:15px}
.card{background:var(--card);border-radius:17px;padding:12px;margin-bottom:12px;box-shadow:0 2px 12px #0000000b}
.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.weekdays div{text-align:center;color:var(--muted);font-size:10px;font-weight:800;padding:4px 0}
.day{display:flex;flex-direction:column;min-height:78px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:4px;cursor:pointer;overflow:hidden}
.day.other{opacity:.32}.day.today{outline:2px solid #f59e0b;outline-offset:-2px}
.num{font-size:12px;font-weight:800;margin-bottom:auto}
.badge{display:block;text-align:center;border-radius:7px;padding:4px 2px;margin-top:4px;font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden}
.work{background:#111827;color:#fff}.extra{background:#2563eb;color:#fff}.off{background:#f3f4f6;color:#6b7280}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{text-align:center;background:#f8fafc;border-radius:12px;padding:10px}.stat b{font-size:19px;display:block}.stat span{font-size:10px;color:var(--muted)}
.weekly-breakdown{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.weekly-breakdown div{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted)}
.weekly-breakdown b{color:var(--ink)}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:720px;margin:auto 0 0;background:#fff;border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow-y:auto;}
.sheet h2{margin:0 0 8px;font-size:21px}.sheet .date-label{font-size:13px;color:var(--muted);margin-bottom:12px}
label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:10px 0 5px}
input, select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink);margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}
.day-toggles{display:flex;gap:4px;margin-bottom:12px}
.day-toggle{flex:1;text-align:center;padding:8px 0;background:#f3f4f6;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer;user-select:none;border:1px solid transparent}
.day-toggle.active{background:#111827;color:#fff}
.auth-container{max-width:400px;margin:40px auto;background:#fff;padding:20px;border-radius:17px;box-shadow:0 2px 12px #0000000b;text-align:center}
#errorMsg{color:var(--danger);font-size:12px;margin-bottom:10px;display:none}
@media(min-width:650px){.modal{align-items:center}.sheet{border-radius:18px;margin:auto}}
</style>
</head>
<body>

<!-- Authentication Screen -->
<div id="authScreen" class="auth-container">
    <h2>Welcome to My Rota</h2>
    <p style="font-size:13px; color:gray; margin-bottom: 20px;">Sign in or create an account to sync your shifts to the cloud.</p>
    <div id="errorMsg"></div>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    <div class="actions">
        <button class="primary" onclick="login()">Log In</button>
        <button class="blue" onclick="register()">Register</button>
    </div>
</div>

<!-- Main App -->
<div id="mainApp" style="display:none;">
    <header>
        <div class="header-text">
            <h1>My Rota</h1>
            <p id="headCycle">2-week repeating rota</p>
        </div>
        <div class="header-actions">
            <!-- New Pay Summary Button -->
            <button class="icon-btn" onclick="openPay()" title="Pay Summary">£</button>
            <button class="icon-btn" onclick="openSettings()" title="Settings">⚙</button>
            <button class="icon-btn" onclick="logout()" title="Log Out">⎋</button>
        </div>
    </header>
    <main style="display:block;">
    <div class="toolbar"><button onclick="month(-1)">‹</button><div class="month" id="title"></div><button onclick="month(1)">›</button></div>
    <div class="toolbar"><button class="primary" onclick="today()">Today</button><button class="blue" onclick="openShift()">＋ Add OT</button></div>

    <div class="card">
    <div class="weekdays"><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div></div>
    <div class="grid" id="grid"></div>
    </div>

    <div class="card">
    <div class="stats">
    <div class="stat"><b id="normal">0</b><span>Normal Hrs</span></div>
    <div class="stat"><b id="extras">0</b><span>OT Hrs</span></div>
    <div class="stat"><b id="total">0</b><span>Total Hrs</span></div>
    </div>
    <div class="weekly-breakdown" id="weekly"></div>
    </div>
    </main>
</div>

<!-- Pay Summary Modal (Hidden by Default) -->
<div class="modal" id="payModal"><div class="sheet">
<h2>Pay Summary</h2>
<div class="date-label" id="payPeriodLabel"></div>
<div class="stats" style="margin-bottom: 15px;">
<div class="stat"><b id="earnNormal">£0</b><span>Normal Pay</span></div>
<div class="stat"><b id="earnOT">£0</b><span>OT Pay</span></div>
<div class="stat"><b id="earnTotal">£0</b><span>Total Pay</span></div>
</div>
<div class="actions"><button onclick="closeModal('payModal')">Close</button></div>
</div></div>

<!-- Shift Modal -->
<div class="modal" id="modal"><div class="sheet">
<h2 id="modalHead">Overtime Shift</h2><div class="date-label" id="modalDate"></div>
<label>Date</label><input id="date" type="date">
<div class="row"><div><label>Start time</label><input id="start" type="time" value="07:00"></div><div><label>End time</label><input id="end" type="time" value="19:00"></div></div>
<label>Note</label><input id="note" placeholder="e.g. picked up extra shift">
<div class="actions"><button onclick="closeModal('modal')">Cancel</button><button class="blue" onclick="saveShift()">Save</button></div>
<div class="actions"><button class="danger" id="del" onclick="removeShift()">Delete OT</button></div>
</div></div>

<!-- Settings Modal -->
<div class="modal" id="settingsModal"><div class="sheet">
<h2>Rota Settings</h2>
<label>Base Hourly Rate (£)</label>
<input type="number" id="setRate" step="0.1" value="13">

<label>Week 1 Working Days</label>
<div class="day-toggles" id="togglesW1">
    <div class="day-toggle" onclick="toggleDay(this, 0)">M</div><div class="day-toggle" onclick="toggleDay(this, 1)">T</div><div class="day-toggle" onclick="toggleDay(this, 2)">W</div><div class="day-toggle" onclick="toggleDay(this, 3)">T</div><div class="day-toggle" onclick="toggleDay(this, 4)">F</div><div class="day-toggle" onclick="toggleDay(this, 5)">S</div><div class="day-toggle" onclick="toggleDay(this, 6)">S</div>
</div>

<label>Week 2 Working Days</label>
<div class="day-toggles" id="togglesW2">
    <div class="day-toggle" onclick="toggleDay(this, 0)">M</div><div class="day-toggle" onclick="toggleDay(this, 1)">T</div><div class="day-toggle" onclick="toggleDay(this, 2)">W</div><div class="day-toggle" onclick="toggleDay(this, 3)">T</div><div class="day-toggle" onclick="toggleDay(this, 4)">F</div><div class="day-toggle" onclick="toggleDay(this, 5)">S</div><div class="day-toggle" onclick="toggleDay(this, 6)">S</div>
</div>

<label>Cycle Anchor Date (Pick any Monday)</label>
<input type="date" id="setAnchorDate">

<label>Was that Monday in Week 1 or Week 2?</label>
<select id="setAnchorWeek">
    <option value="1">Week 1</option>
    <option value="2">Week 2</option>
</select>

<div class="actions"><button onclick="closeModal('settingsModal')">Cancel</button><button class="blue" onclick="saveSettings()">Save Settings</button></div>
</div></div>

<!-- Firebase SDKs & App Logic -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8IYwfAzxYEgYu9T-WFkq8RAj9bJVfPyo",
  authDomain: "my-rota-fe2f3.firebaseapp.com",
  projectId: "my-rota-fe2f3",
  storageBucket: "my-rota-fe2f3.firebasestorage.app",
  messagingSenderId: "685191190045",
  appId: "1:685191190045:web:10878b6995bd4549d3d8f4",
  measurementId: "G-WN5Z55MH1T"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let view = new Date();
let extras = {};
const defaultSettings = { rate: 13, anchorDate: "2026-09-07", anchorWeek: 2, w1: [0,5,6], w2: [0,2,4] };
let settings = { ...defaultSettings };
let selected = null;

window.login = () => {
    let e = document.getElementById("email").value, p = document.getElementById("password").value;
    signInWithEmailAndPassword(auth, e, p).catch(err => showError(err.message));
};
window.register = () => {
    let e = document.getElementById("email").value, p = document.getElementById("password").value;
    createUserWithEmailAndPassword(auth, e, p).catch(err => showError(err.message));
};
window.logout = () => signOut(auth);

function showError(msg) {
    let el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
}

onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUser = user;
        document.getElementById("authScreen").style.display = "none";
        document.getElementById("mainApp").style.display = "block";
        await loadCloudData();
        render();
    } else {
        currentUser = null;
        document.getElementById("authScreen").style.display = "block";
        document.getElementById("mainApp").style.display = "none";
    }
});

async function loadCloudData() {
    if(!currentUser) return;
    const docRef = doc(db, "users", currentUser.uid);
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
        let data = docSnap.data();
        extras = data.extras || {};
        settings = data.settings || defaultSettings;
    } else {
        extras = {};
        settings = { ...defaultSettings };
    }
}

async function saveToCloud() {
    if(currentUser) {
        await setDoc(doc(db, "users", currentUser.uid), { settings, extras });
    }
}

function iso(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate(), 12).toISOString().slice(0,10)}
function dateFrom(s){let [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12)}
function diff(a,b){return Math.round((dateFrom(a)-dateFrom(b))/86400000)}

function getHours(start, end) {
  if(!start || !end) return 0;
  let [sh, sm] = start.split(':').map(Number);
  let [eh, em] = end.split(':').map(Number);
  let hrs = (eh + em/60) - (sh + sm/60);
  if(hrs < 0) hrs += 24; 
  return hrs;
}

function permanent(d){
 let x = diff(iso(d), settings.anchorDate);
 let weekDiff = Math.floor(x/7);
 let isAnchorW1 = parseInt(settings.anchorWeek) === 1;
 let cycle = (isAnchorW1 ? weekDiff : weekDiff + 1) % 2;
 if(cycle < 0) cycle += 2;
 let wd = (d.getDay()+6)%7;
 return (cycle === 0 ? new Set(settings.w1) : new Set(settings.w2)).has(wd);
}

function render(){
 let cycleWeek = diff(iso(new Date()), settings.anchorDate);
 cycleWeek = Math.floor(cycleWeek/7);
 let isAnchorW1 = parseInt(settings.anchorWeek) === 1;
 let cycle = (isAnchorW1 ? cycleWeek : cycleWeek + 1) % 2;
 if(cycle < 0) cycle += 2;
 document.getElementById("headCycle").textContent = `Current Cycle: Week ${cycle === 0 ? 1 : 2}`;
 
 let y=view.getFullYear(), m=view.getMonth();
 let pStart = new Date(y, m-1, 26), pEnd = new Date(y, m, 25);
 let start = (pStart.getDay()+6)%7; 
 let days = Math.round((pEnd - pStart)/86400000) + 1;

 let periodText = "Period Ending 25 " + pEnd.toLocaleDateString("en-GB",{month:"short",year:"numeric"});
 document.getElementById("title").textContent = periodText;
 document.getElementById("payPeriodLabel").textContent = periodText;

 let g=document.getElementById("grid");g.innerHTML="";
 
 let normalHrs=0, otHrs=0, currentWeekHrs=0, weekCount=1;
 let weeklyHtml = "<b>Weekly Breakdown (Hours):</b>";

 for(let i=0;i<42;i++){
  let dayOffset = i - start;
  let d = new Date(y, m-1, 26 + dayOffset);
  let other = dayOffset < 0 || dayOffset >= days;
  let key = iso(d), p = permanent(d), x = extras[key];
  
  let dayHrs = 0;
  if(p && !other) { normalHrs += 12.5; dayHrs += 12.5; }
  if(x && !other) { let h = getHours(x.start, x.end); otHrs += h; dayHrs += h; }
  if(!other) currentWeekHrs += dayHrs;

  let c=document.createElement("div");c.className="day"+(other?" other":"")+(key===iso(new Date())?" today":"");
  c.innerHTML='<div class="num">'+d.getDate()+'</div>'+ (p?'<span class="badge work">WORK</span>':'')+(x?'<span class="badge extra">OT '+(x.start||'')+'</span>':'');
  if(!other)c.onclick=()=>openShift(key);g.appendChild(c);

  if((i+1)%7 === 0) {
      if(currentWeekHrs > 0) weeklyHtml += `<div>Week ${weekCount} (ending ${d.getDate()} ${d.toLocaleDateString('en-GB',{month:'short'})}) <b>${currentWeekHrs.toFixed(1)} hrs</b></div>`;
      currentWeekHrs = 0; weekCount++;
  }
 }
 
 document.getElementById("normal").textContent=normalHrs.toFixed(1);
 document.getElementById("extras").textContent=otHrs.toFixed(1);
 document.getElementById("total").textContent=(normalHrs+otHrs).toFixed(1);
 
 let payNormal = normalHrs * parseFloat(settings.rate);
 let payOT = otHrs * (parseFloat(settings.rate) + 1);
 document.getElementById("earnNormal").textContent="£" + payNormal.toFixed(2);
 document.getElementById("earnOT").textContent="£" + payOT.toFixed(2);
 document.getElementById("earnTotal").textContent="£" + (payNormal + payOT).toFixed(2);
 document.getElementById("weekly").innerHTML=weeklyHtml;
}

window.month = n => {view=new Date(view.getFullYear(),view.getMonth()+n,1); render()};
window.today = () => {let d=new Date(); view=new Date(d.getFullYear(),d.getMonth(),1); render()};

window.openShift = (key=iso(new Date())) => {
 selected=key; let x=extras[key];
 document.getElementById("date").value=key; document.getElementById("start").value=x?.start||"07:00"; document.getElementById("end").value=x?.end||"19:00"; document.getElementById("note").value=x?.note||"";
 document.getElementById("modalDate").textContent=dateFrom(key).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 document.getElementById("del").style.display=x?"block":"none";
 document.getElementById("modal").classList.add("show");
};

window.openPay = () => document.getElementById("payModal").classList.add("show");
window.closeModal = id => document.getElementById(id).classList.remove("show");

window.saveShift = async () => {
 let k=document.getElementById("date").value; if(!k) return;
 extras[k]={start:document.getElementById("start").value,end:document.getElementById("end").value,note:document.getElementById("note").value};
 window.closeModal('modal'); render(); saveToCloud();
};

window.removeShift = async () => {
 if(selected){delete extras[selected]; window.closeModal('modal'); render(); saveToCloud();}
};

window.toggleDay = (el) => el.classList.toggle("active");

window.openSettings = () => {
 document.getElementById("setRate").value = settings.rate; document.getElementById("setAnchorDate").value = settings.anchorDate; document.getElementById("setAnchorWeek").value = settings.anchorWeek;
 let w1Toggles = document.getElementById("togglesW1").children, w2Toggles = document.getElementById("togglesW2").children;
 for(let i=0; i<7; i++) {
    w1Toggles[i].classList.toggle("active", settings.w1.includes(i));
    w2Toggles[i].classList.toggle("active", settings.w2.includes(i));
 }
 document.getElementById("settingsModal").classList.add("show");
};

window.saveSettings = async () => {
 settings.rate = document.getElementById("setRate").value; settings.anchorDate = document.getElementById("setAnchorDate").value; settings.anchorWeek = document.getElementById("setAnchorWeek").value;
 settings.w1 = []; settings.w2 = [];
 let w1Toggles = document.getElementById("togglesW1").children, w2Toggles = document.getElementById("togglesW2").children;
 for(let i=0; i<7; i++) {
    if(w1Toggles[i].classList.contains("active")) settings.w1.push(i);
    if(w2Toggles[i].classList.contains("active")) settings.w2.push(i);
 }
 window.closeModal('settingsModal'); render(); saveToCloud();
};

if(location.protocol==="https:"&&"serviceWorker"in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
